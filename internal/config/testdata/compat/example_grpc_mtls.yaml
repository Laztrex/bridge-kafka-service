# gRPC upstream over mutual TLS. Generate the demo certificates first:
#   scripts/gen-demo-certs.sh            # writes certs/demo/*.pem|*.key
#   go run ./examples/grpc-model -addr 127.0.0.1:50051 \
#       -tls-cert certs/demo/server.pem -tls-key certs/demo/server.key -client-ca certs/demo/ca.pem
#   ./bridge-kafka-service --config examples/config_grpc_mtls.yaml
logLevel: info
http.addr: 127.0.0.1:8081

kafka:
  brokers: kafka:29092,kafka2:29093,kafka3:29094,kafka4:29095
  version: 2.3.0

consumer:
  - topics: demo.grpc.in
    group: demo.bridge.grpc
    client_id: demo-grpc
    service:
      name: localhost       # must match a SAN of the server certificate
      port: "50051"
      protocol: grpc
      timeout: 10
      tls:
        mode: mtls          # none (default) | tls | mtls
        ca_path: certs/demo/ca.pem
        cert_path: certs/demo/client.pem
        key_path: certs/demo/client.key
    response_topic: demo.grpc.out

producer:
  - topic: demo.grpc.out
