# Bridge on the host, Kafka from docker-compose, HTTP upstream on localhost:8000 (run your own service, or point this config at one you like).
#   docker compose up -d zookeeper kafka kafka2 kafka3 kafka4
#   (add to /etc/hosts:  127.0.0.1 kafka kafka2 kafka3 kafka4)
#   ./bridge-kafka-service --config examples/config_local_http.yaml
log.level: info
health.addr: 127.0.0.1:8081

kafka:
  brokers: kafka:29092,kafka2:29093,kafka3:29094,kafka4:29095
  version: 2.3.0

consumer:
  - topics: demo.in
    group: demo.bridge
    client_id: demo
    service:
      name: localhost
      port: "8000"          # your HTTP service, listening on the host
      path: /predict
    response_topic: demo.out

producer:
  - topic: demo.out         # response_topic must be listed here
  - topic: demo.http.out    # target of POST /api/v1/publish
