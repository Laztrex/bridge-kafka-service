# gRPC upstream, plaintext. Start the example service first:
#   go run ./examples/grpc-model -addr 127.0.0.1:50051
#   ./bridge-kafka-service --config examples/config_grpc.yaml
logLevel: info
http.addr: 127.0.0.1:8081

kafka:
  brokers: kafka:29092,kafka2:29093,kafka3:29094,kafka4:29095
  version: 2.3.0

consumer:
  - topics: demo.grpc.in
    group: demo.bridge.grpc
    client_id: demo-grpc
    service:
      name: 127.0.0.1
      port: "50051"
      protocol: grpc        # path is not used for gRPC
      timeout: 10           # seconds
    response_topic: demo.grpc.out

producer:
  - topic: demo.grpc.out
